<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#A80F1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Saddle Up Shirts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Nunito:wght@600;800;900&family=Rye&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="center" hidden>
  <div class="hero"><h1>Saddle Up</h1><p>Shirt headquarters</p></div>
  <div class="sec">
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" autocapitalize="none" style="width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" style="width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px">
    <button class="btn red block" id="go" style="margin-top:12px">Sign in</button>
    <div class="err" id="loginErr" role="alert"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="hdr">
    <div class="grow"><h1>Saddle Up</h1><div class="sub">Team Jessie's Breasties</div></div>
    <button class="btn" id="newBtn">+ Order</button>
  </header>
  <div class="wrap">
    <div class="tabs"><button id="tOrders" class="on">Orders</button><button id="tStock">Stock</button></div>
    <div id="orders">
      <div class="stats" id="stats"></div>
      <input class="search" id="q" type="search" placeholder="Search names" aria-label="Search names">
      <div class="chips" id="chips"></div>
      <div id="list"></div>
    </div>
    <div id="stockView" hidden></div>
  </div>
</div>
<div id="sheetHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script src="/config.js"></script>
<script src="/data.js"></script>
<script src="/app.js"></script>
</body>
</html>
